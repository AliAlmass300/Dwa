<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الدوا"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#b23a5a"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>كالاندريي الدوا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Tajawal:wght@400;500;700;800&family=Almarai:wght@400;700;800&family=El+Messiri:wght@500;700&family=Aref+Ruqaa:wght@400;700&family=Changa:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone app, right-to-left, sticky day header, list of dose cards, fixed bottom tab bar */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --ink:#123b37; --muted:#5d7774; --line:#dbe6e3;
  --accent:#0d7a6e; --accent-soft:#d8efeb; --gold:#c08a1e;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --bad:#c2412d; --bad-soft:#fbe3de; --warn:#a86a00; --warn-soft:#fbefd4;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  --f-box:"Lalezar","Reem Kufi",system-ui,sans-serif; --f-book:"Noto Naskh Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1716; --surface:#13221f; --ink:#e3f0ed; --muted:#93aaa6; --line:#24383a;
  --accent:#3cc1ad; --accent-soft:#163a35; --gold:#e0b34f;
  --ok:#4cc985; --ok-soft:#14321f; --bad:#f07a66; --bad-soft:#3a1a15; --warn:#e9b04c; --warn-soft:#3a2c10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1716; --surface:#13221f; --ink:#e3f0ed; --muted:#93aaa6; --line:#24383a;
  --accent:#3cc1ad; --accent-soft:#163a35; --gold:#e0b34f;
  --ok:#4cc985; --ok-soft:#14321f; --bad:#f07a66; --bad-soft:#3a1a15; --warn:#e9b04c; --warn-soft:#3a2c10; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toprow h1{font-size:1.5rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;font-size:1.1rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:0;background:transparent;border-radius:12px;padding:6px 0;display:grid;gap:2px;justify-items:center;color:var(--muted);font-size:.72rem}
.wd b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.wd.sel{background:var(--accent);color:#fff}.wd.sel b{color:#fff}
.wd .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .dot.ok{background:var(--ok)}.wd .dot.part{background:var(--warn)}.wd .dot.bad{background:var(--bad)}.wd .dot.chg{background:var(--gold)}
.wd.sel .dot{background:#fff}
.alerts{display:grid;gap:8px;margin-block:4px 12px}
.alert{border-radius:12px;padding:10px 12px;font-size:.92rem;display:flex;gap:8px;align-items:flex-start}
.alert.chg{background:var(--warn-soft);color:var(--warn)}
.alert.low{background:var(--bad-soft);color:var(--bad)}
.alert.now{background:var(--accent);color:#fff;font-weight:600}
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:14px}
.next .lbl{font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.next .t{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.slot{display:grid;gap:8px;margin-bottom:16px}
.slot h3{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.slot h3::after{content:"";flex:1;height:1px;background:var(--line)}
.dose{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.dose.taken{background:var(--ok-soft);border-color:transparent}
.dose.missed{border-color:var(--bad)}
.ph{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:var(--accent);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.dose .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.dose .amt{font-size:.9rem;color:var(--muted)}
.cap{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-weight:600;font-size:.88rem}
.st{font-size:.78rem;font-weight:600}
.st.bad{color:var(--bad)}.st.ok{color:var(--ok)}
.tick{width:52px;height:52px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:1.4rem;display:grid;place-items:center}
.dose.taken .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.tick small{display:block;font-size:.6rem;line-height:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.85rem}
/* month */
.mhead{display:flex;justify-content:space-between;align-items:center;margin-block:6px 10px}
.mhead h2{font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .dn{font-size:.7rem;text-align:center;color:var(--muted)}
.cell{aspect-ratio:1/1.15;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;align-content:space-between;justify-items:center;padding:4px 0;font-variant-numeric:tabular-nums}
.cell.out{visibility:hidden}
.cell.today{border-color:var(--accent);border-width:2px}
.cell .n{font-weight:600}
.bar{width:70%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.cell .chgm{font-size:.62rem;color:var(--gold);line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* meds */
.med{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:start;width:100%}
.med .nm{font-weight:600}
.steps{display:grid;gap:4px;margin-top:6px}
.stp{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.stp.cur{color:var(--ink);font-weight:600}
.stp.cur::before{content:"●";color:var(--accent)}
.list{display:grid;gap:10px}
.sec{display:grid;gap:12px;margin-block:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.panel p{margin:0;color:var(--muted);font-size:.9rem}
/* form */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet .inner{max-width:560px;margin:0 auto;padding-inline:16px;display:grid;gap:14px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;min-width:0}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .ph{width:84px;height:84px}
.stepbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drow{display:grid;grid-template-columns:1.1fr .8fr 1fr auto;gap:6px;align-items:end}
.x{border:0;background:transparent;color:var(--bad);font-size:1.2rem;padding:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--muted)}
/* tabs */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:transparent;padding:10px 0 8px;display:grid;justify-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.tabs button span{font-size:1.25rem}
.tabs button.on{color:var(--accent);font-weight:600}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;text-align:center;max-width:528px;margin:0 auto}
.ex{font-size:.7rem;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:0 6px;margin-inline-start:6px;font-weight:600}
/* ---- skins (theme options) ---- */
:root[data-skin="majorelle"]{--bg:#f2f4fb;--surface:#fff;--ink:#141f4a;--muted:#5a6488;--line:#d8def0;--accent:#2141c4;--accent-soft:#dfe5fb;--gold:#c99200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-skin="majorelle"]{--bg:#0b1024;--surface:#131a36;--ink:#e6eaff;--muted:#99a3cc;--line:#252e55;--accent:#7f98ff;--accent-soft:#1c2858;--gold:#f2c14e}}
:root[data-theme="dark"][data-skin="majorelle"]{--bg:#0b1024;--surface:#131a36;--ink:#e6eaff;--muted:#99a3cc;--line:#252e55;--accent:#7f98ff;--accent-soft:#1c2858;--gold:#f2c14e}
:root[data-skin="warda"]{--bg:#fbf3f2;--surface:#fff;--ink:#46202a;--muted:#86606a;--line:#efdcdc;--accent:#b23a5a;--accent-soft:#f7dfe5;--gold:#b7791f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-skin="warda"]{--bg:#1a0f12;--surface:#26161b;--ink:#f6e6ea;--muted:#c09ba4;--line:#3d252c;--accent:#f0839f;--accent-soft:#4a2230;--gold:#e8b25c}}
:root[data-theme="dark"][data-skin="warda"]{--bg:#1a0f12;--surface:#26161b;--ink:#f6e6ea;--muted:#c09ba4;--line:#3d252c;--accent:#f0839f;--accent-soft:#4a2230;--gold:#e8b25c}
:root[data-skin="lil"]{--bg:#0e0d1a;--surface:#191729;--ink:#ecebff;--muted:#a19fc4;--line:#2c2944;--accent:#9d8cff;--accent-soft:#2a2550;--gold:#ffcf5c;--ok:#5ad19a;--ok-soft:#173326;--bad:#ff8a7a;--bad-soft:#3d1a18;--warn:#f3bb55;--warn-soft:#3a2d12;color-scheme:dark}
/* ---- layouts ---- */
.L-timeline .slot{border-inline-start:3px solid var(--accent-soft);padding-inline-start:14px;gap:4px;margin-bottom:10px}
.L-timeline .slot h3{color:var(--accent);margin-inline-start:-23px}
.L-timeline .slot h3::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);flex:none}
.L-timeline .dose{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;grid-template-columns:44px 1fr auto}
.L-timeline .dose.taken{background:transparent;opacity:.6}
.L-timeline .dose.missed{border-bottom-color:var(--bad)}
.L-timeline .ph{width:44px;height:44px;border-radius:50%}
.L-timeline .tick{width:44px;height:44px;font-size:1.1rem}
.L-big{font-size:19px}
.L-big .dose{grid-template-columns:1fr;justify-items:center;text-align:center;padding:16px;gap:10px}
.L-big .dose .ph{width:120px;height:120px;font-size:2.4rem}
.L-big .dose .nm{font-size:1.3rem}
.L-big .cap{font-size:1.2rem;padding:4px 16px}
.L-big .tick{width:100%;height:64px;border-radius:14px;font-size:1.3rem}
.L-big .tick small{font-size:1rem;display:inline;margin-inline-start:8px}
.L-big .tick span{display:inline-flex;align-items:center}
.L-big .slot h3{font-size:1.3rem;color:var(--ink)}
.L-big .next .t{font-size:2.4rem}
/* settings */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:grid;gap:6px;text-align:start}
.opt.on{border-color:var(--accent)}
.opt b{font-size:.95rem}.opt span{font-size:.78rem;color:var(--muted)}
.sw{display:flex;gap:4px}.sw i{width:22px;height:22px;border-radius:50%;display:inline-block;border:1px solid rgba(128,128,128,.3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 4px;font-size:.9rem}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.mini{height:54px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;gap:3px;padding:5px;align-content:start}
.mini i{display:block;height:9px;border-radius:3px;background:var(--accent-soft)}

/* ===== Design 1: الحلقة (ring) ===== */
.ring-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px}
.ring-hd b{font-family:var(--display);font-size:1.45rem;display:block}
.ring-hd span{color:var(--muted);font-size:.88rem}
.greet{padding-top:14px;font-weight:600;color:var(--accent);font-size:1rem}
.ringc{width:70px;height:70px;position:relative;flex:none}
.ringc svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringc div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:5px;align-items:center}
.chips .d{flex:1;min-width:0;border-radius:14px;padding:6px 0;text-align:center;background:var(--surface);border:1px solid var(--line);font-size:.66rem;color:var(--muted);display:grid;gap:1px}
.chips .d b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.chips .d.on{background:var(--accent);border-color:var(--accent);color:#fff}.chips .d.on b{color:#fff}
.chips .d i{width:5px;height:5px;border-radius:50%;margin:0 auto;background:transparent}
.chips .d i.ok{background:var(--ok)}.chips .d i.bad{background:var(--bad)}.chips .d i.part{background:var(--warn)}.chips .d i.chg{background:var(--gold)}
.chips .ar{border:0;background:transparent;color:var(--muted);font-size:1.2rem;padding:4px}
.hero{background:var(--accent);color:#fff;border-radius:22px;padding:14px;display:grid;gap:10px;margin-bottom:14px}
.hero .tp{display:flex;gap:12px;align-items:center}
.hero .ph{width:66px;height:66px;background:rgba(255,255,255,.22);color:#fff}
.hero small{opacity:.85;font-size:.78rem;display:block}
.hero b{font-family:var(--display);font-size:1.2rem;display:block;overflow-wrap:anywhere}
.hero .t{font-family:var(--display);font-size:1.9rem;margin-inline-start:auto;font-variant-numeric:tabular-nums}
.hero .go{border:0;border-radius:14px;padding:12px;background:#fff;color:var(--accent);font-weight:700;font-size:1rem}
.lbl2{font-weight:600;font-size:.88rem;color:var(--muted);margin-block:4px 8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:6px;align-content:start}
.tile .ph{width:100%;height:84px;font-size:1.8rem}
.tile b{font-size:.92rem;overflow-wrap:anywhere}
.tile .m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ck{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center;font-weight:700;padding:0}
.tile.done{opacity:.6}.done .ck,.ck.y{background:var(--ok);border-color:var(--ok);color:#fff}
.tile.miss{border-color:var(--bad)}.tile.miss .m{color:var(--bad)}
.tile .chg,.chip .chg{color:var(--gold);font-size:.72rem}
.rgrp{display:grid;gap:8px;margin-bottom:14px}
.rgrp .lbl2{display:flex;justify-content:space-between;margin:0;font-variant-numeric:tabular-nums}
.rrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.rrow .ph{width:64px;height:64px;border-radius:14px}
.rrow .tx{display:grid;gap:1px;min-width:0}
.rrow .tx b{font-size:1rem;overflow-wrap:anywhere}
.rrow .tx span{font-size:.84rem;color:var(--muted)}
.rrow .tx .okt{color:var(--ok)}.rrow .tx .bad{color:var(--bad)}.rrow .tx .chg{color:var(--gold)}
.rrow .ck{width:44px;height:44px}
.rrow.done{background:var(--ok-soft);border-color:transparent}
.rrow.miss{border-color:var(--bad)}
html[data-layout="ring"] #app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
html[data-layout="ring"] .tabs{bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline:24px;max-width:420px;margin:0 auto;border-radius:999px;background:var(--ink);border:0;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
html[data-layout="ring"] .tabs button{color:var(--bg);opacity:.75;border-radius:999px;padding:6px 0}
html[data-layout="ring"] .tabs button.on{background:var(--accent);color:#fff;opacity:1}
/* ===== Design 2: العلبة (pillbox) ===== */
.box-hd{display:flex;justify-content:space-between;align-items:end;gap:10px;padding-top:14px}
.box-hd b{font-family:var(--f-box);font-weight:400;font-size:1.9rem;line-height:1}
.box-hd span{color:var(--muted);font-size:.85rem}
.mx{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:3px;font-size:.66rem;color:var(--muted);align-items:center;text-align:center}
.mx button{border:0;background:transparent;font-size:.68rem;color:var(--muted);padding:2px 0}
.mx button.on{color:var(--accent);font-weight:700}
.mx i{height:13px;border-radius:3px;background:var(--line);display:block}
.mx i.k{background:var(--ok)}.mx i.x{background:var(--bad)}.mx i.u{background:var(--accent-soft)}.mx i.n{background:transparent;border:1px dashed var(--line)}.mx i.on{outline:2px solid var(--accent);outline-offset:1px}
.wkn{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.wkn button{border:0;background:transparent;color:var(--accent);font-size:.85rem;padding:4px}
.bx{border-radius:20px;padding:12px;display:grid;gap:8px;border:2px solid var(--line);background:var(--surface);margin-bottom:10px}
.bx .lid{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bx .lid b{font-family:var(--f-box);font-weight:400;font-size:1.3rem}
.bx .lid span{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bx.done{background:var(--ok-soft);border-color:transparent}
.bx.cur{border-color:var(--accent);background:var(--accent-soft)}
.bx.miss{border-color:var(--bad)}
.chip{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:7px}
.bx.done .chip{background:transparent}
.chip .ph{width:44px;height:44px;border-radius:50%}
.chip .tx{flex:1;min-width:0;font-size:.9rem;overflow-wrap:anywhere}
.chip .tx small{display:block;color:var(--muted);font-size:.76rem}
.chip .ck{border-radius:11px;width:40px;height:40px}
.bx .none{font-size:.82rem;color:var(--muted)}
/* ===== Design 3: الدفتر (notebook) ===== */
html[data-layout="book"] body{background:var(--surface)}
html[data-layout="book"] .top{background:var(--surface)}
.bk-hd{display:flex;align-items:end;gap:12px;padding-block:16px 10px;border-bottom:2px solid var(--ink)}
.bk-hd .n{font-family:var(--f-book);font-size:4.2rem;font-weight:700;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.bk-hd b{font-family:var(--f-book);font-size:1.45rem;display:block}
.bk-hd span{color:var(--muted);font-size:.85rem}
.bk-hd .pr{margin-inline-start:auto;text-align:center;font-size:.75rem;color:var(--muted)}
.bk-hd .pr b{font-family:var(--body);font-size:1.15rem;color:var(--ink)}
.bwk{display:flex;justify-content:space-between;align-items:center}
.bwk button{border:0;background:transparent;font-size:.78rem;color:var(--muted);padding:6px 2px;border-bottom:2px solid transparent;font-variant-numeric:tabular-nums}
.bwk button.on{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.bnote{font-size:.85rem;color:var(--accent);padding-block:4px}
.bnote.low{color:var(--bad)}
.bsec{font-family:var(--f-book);color:var(--accent);font-size:1rem;padding-top:12px}
.ln{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding-block:11px;border-bottom:1px solid var(--line)}
.ln .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:.92rem;padding-top:3px}
.ln b{font-family:var(--f-book);font-size:1.15rem;font-weight:700;display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}
.ln b .ph{width:32px;height:32px;border-radius:8px;font-size:.9rem}
.ln .d{font-size:.85rem;color:var(--muted)}
.ln .note{font-size:.8rem;color:var(--accent);margin-top:2px}
.ln .ck{width:30px;height:30px;border:1.5px solid var(--ink);color:var(--ink)}
.ln.done b{text-decoration:line-through;color:var(--muted)}.ln.done .d{color:var(--muted)}
.ln.done .ck{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ln.miss .t{color:var(--bad)}.ln.miss .ck{border-color:var(--bad)}
html[data-layout="book"] .tabs{background:var(--surface)}
html[data-layout="book"] .tabs button span{display:none}
html[data-layout="book"] .tabs button{font-size:.88rem;padding:14px 0 10px}
html[data-layout="book"] .tabs button.on{color:var(--ink);font-weight:700}
html[data-layout="book"] .tabs button.on::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:2px auto 0}
@media (prefers-reduced-motion:no-preference){.dose,.tick{transition:background .2s,border-color .2s}}
</style>

<script>
document.documentElement.lang="ar";document.documentElement.dir="rtl";
const DSHORT=["حد","تنين","تلات","ربع","خميس","جمعة","سبت"];
const DAYS=["الحد","الاتنين","التلات","لاربع","الخميس","الجمعة","السبت"];
const MONTHS=["يناير","فبراير","مارس","أبريل","ماي","يونيو","يوليوز","غشت","شتنبر","أكتوبر","نونبر","دجنبر"];
const UNITS=["حبة","نص حبة","كبسولة","ملعقة","قطرة","بخة","حقنة","ml","mg"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=()=>iso(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDay=s=>{const d=parse(s);return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]};
const short=s=>{const d=parse(s);return d.getDate()+" "+MONTHS[d.getMonth()]};
const T=t=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return (h%12||12)+":"+String(m).padStart(2,"0")+"\u00a0"+(h<12?"ص":"م")};
const amtWord=a=>{const x=String(a??"").trim(),n=parseFloat(x);if(String(n)!==x)return x;const w=Math.floor(n),f=+(n-w).toFixed(2);const fw=f===0.5?"نصف":f===0.25?"ربع":f===0.75?"تلت رباع":"";if(!fw)return x;return w?w+" و"+fw:fw};
const amtTxt=d=>amtWord(d.amount)+" "+(d.unit||"");

const S={view:"day",day:todayIso(),month:todayIso().slice(0,7),meds:[],photos:{},log:{},db:null,dl:null,ready:false};
try{const v=localStorage.getItem("dwa.view");if(v)S.view=v}catch(e){}
const P={skin:"warda",layout:"ring",mode:"auto",font:"messiri"};
try{const n=localStorage.getItem("dwa.prefs4");if(n)Object.assign(P,JSON.parse(n));else{Object.assign(P,JSON.parse(localStorage.getItem("dwa.prefs3")||"{}"));P.font="messiri"}}catch(e){}
function applyPrefs(){const r=document.documentElement;r.dataset.skin=P.skin;if(P.mode==="auto")delete r.dataset.theme;else r.dataset.theme=P.mode;
  r.dataset.layout=P.layout;const F=FONTS.find(f=>f[0]===P.font)||FONTS[0];const st=r.style;if(F[0]==="asli"){["--display","--body","--f-box","--f-book"].forEach(k=>st.removeProperty(k))}else{st.setProperty("--display",F[3]);st.setProperty("--body",F[4]);st.setProperty("--f-box",F[3]);st.setProperty("--f-book",F[3])}try{localStorage.setItem("dwa.prefs4",JSON.stringify(P))}catch(e){}}
const FONTS=[
 ["asli","الأصلي","كل تصميم بالخط ديالو","",""],
 ["tajawal","تجوال","نقي وعصري",'"Tajawal",system-ui,sans-serif','"Tajawal",system-ui,sans-serif'],
 ["almarai","المراعي","مدور وساهل للقراية",'"Almarai",system-ui,sans-serif','"Almarai",system-ui,sans-serif'],
 ["messiri","المسيري","أنيق ومعوج شوية",'"El Messiri",system-ui,sans-serif','"Tajawal",system-ui,sans-serif'],
 ["ruqaa","الرقعة","خط اليد العربي",'"Aref Ruqaa","Noto Naskh Arabic",serif','"Almarai",system-ui,sans-serif'],
 ["changa","شنقة","عريض وقوي",'"Changa",system-ui,sans-serif','"Changa",system-ui,sans-serif']];
applyPrefs();
const SKINS=[["zellige","زليج","أخضر الزليج، هادئ",["#0d7a6e","#d8efeb","#c08a1e"]],["majorelle","ماجوريل","زرق ماجوريل ومصفر",["#2141c4","#dfe5fb","#c99200"]],["warda","وردة","وردي دافي",["#b23a5a","#f7dfe5","#b7791f"]],["lil","الليل","غامق ديما، مريح لعينين",["#0e0d1a","#9d8cff","#ffcf5c"]]];
const LAYOUTS=[["ring","1. الحلقة","الدوا الجاي كبير، والباقي مربعات بالتصاور"],["box","2. العلبة","النهار ف 4 خانات بحال علبة الدوا"],["book","3. الدفتر","ليستة نقية بخط عربي، كيتشطب ملي تاخدو"]];
if(!LAYOUTS.some(l=>l[0]===P.layout))P.layout="ring";
const PERIODS=[["☀️ الصباح",0,12],["🌤 الظهر",12,15],["🌇 العشية",15,19],["🌙 الليل",19,24]];
const perIdx=t=>{const h=+t.slice(0,2);return h<12?0:h<15?1:h<19?2:3};
const period=t=>{const h=+t.slice(0,2);return h<12?"الصباح":h<15?"الظهر":h<19?"العشية":"الليل"};

/* ---------- schedule logic ---------- */
function stepFor(med,date){return (med.steps||[]).find(s=>s.start<=date&&(!s.end||date<=s.end))}
function dosesOn(date){
  const out=[];
  for(const m of S.meds){const st=stepFor(m,date);if(!st)continue;
    for(const d of st.doses||[]) out.push({med:m,time:d.time,amount:d.amount,unit:d.unit,key:date+"_"+m.id+"_"+d.time.replace(":","")});}
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
const sig=(m,date)=>{const s=stepFor(m,date);return s?JSON.stringify((s.doses||[]).map(d=>[d.time,d.amount,d.unit])):""};
function changesOn(date){ // meds whose dose on `date` differs from the day before
  const prev=addDays(date,-1);return S.meds.filter(m=>sig(m,date)!==sig(m,prev)&&(sig(m,prev)||sig(m,date)));
}
function dayStatus(date){
  const ds=dosesOn(date);if(!ds.length)return null;
  const taken=ds.filter(d=>S.log[d.key]).length;return{total:ds.length,taken};
}
function isMissed(date,time,key){
  if(S.log[key])return false;const t=todayIso();
  return date<t||(date===t&&tMin(time)+60<nowMin());
}
function dailyUse(m,date){const s=stepFor(m,date);return s?(s.doses||[]).reduce((a,d)=>a+(parseFloat(d.amount)||0),0):0}

/* ---------- alerts ---------- */
function alertsFor(date){
  const out=[],tom=addDays(date,1);
  for(const m of S.meds){
    const a=sig(m,date),b=sig(m,tom);
    if(a!==b){
      const s2=stepFor(m,tom);
      if(!s2)out.push(["chg","⏳","<b>"+esc(m.name)+"</b>: غدا آخر نهار. من بعد غدا ما بقاش."]);
      else if(!a)out.push(["chg","🆕","<b>"+esc(m.name)+"</b> كيبدا غدا: "+esc(s2.doses.map(d=>amtTxt(d)+" ف "+T(d.time)).join("، "))]);
      else out.push(["chg","🔁","غدا كيتبدل الدوز ديال <b>"+esc(m.name)+"</b>: "+esc(s2.doses.map(d=>amtTxt(d)+" ف "+T(d.time)).join("، "))]);
    }
    if(typeof m.stock==="number"&&date===todayIso()){
      const u=dailyUse(m,date);
      if(u>0&&m.stock/u<=5)out.push(["low","📦","<b>"+esc(m.name)+"</b> قرب يسالي: باقي "+m.stock+" ("+Math.floor(m.stock/u)+" أيام). شري جديد."]);
    }
  }
  return out;
}

/* ---------- rendering ---------- */
const app=document.getElementById("app");
function ph(m,big){const p=S.photos[m.id];return '<div class="ph">'+(p?'<img alt="" src="'+p+'">':esc((m.name||"؟").trim()[0]||"؟"))+'</div>'}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  ({day:renderDay,month:renderMonth,meds:renderMeds,alarms:renderAlarms})[S.view]();
}
function weekStrip(){
  const d=parse(S.day);const start=addDays(S.day,-d.getDay());let h='<div class="week">';
  for(let i=0;i<7;i++){const x=addDays(start,i),st=dayStatus(x),xd=parse(x);
    let dc="";if(changesOn(x).length&&x>todayIso())dc="chg";
    if(st&&x<=todayIso()){dc=st.taken===st.total?"ok":(x<todayIso()?(st.taken?"part":"bad"):"")}
    h+='<button class="wd'+(x===S.day?" sel":"")+'" data-day="'+x+'">'+DAYS[xd.getDay()]+'<b>'+xd.getDate()+'</b><i class="dot '+dc+'"></i></button>'}
  return h+'</div>';
}
function dayTitle(date){const t=todayIso();return date===t?"اليوم":date===addDays(t,1)?"غدا":date===addDays(t,-1)?"البارح":DAYS[parse(date).getDay()]}
function weekDays(){const d=parse(S.day);const st=addDays(S.day,-d.getDay());return [0,1,2,3,4,5,6].map(i=>addDays(st,i))}
function dayDot(x){const st=dayStatus(x),t=todayIso();if(st&&x<=t){if(st.taken===st.total)return"ok";if(x<t)return st.taken?"part":"bad";return""}return changesOn(x).length&&x>t?"chg":""}
function changeNote(m,date){const tom=addDays(date,1);if(sig(m,date)===sig(m,tom))return"";const s2=stepFor(m,tom);
  return s2?"◆ من غدا: "+s2.doses.map(d=>amtTxt(d)+" ف "+T(d.time)).join("، "):"◆ آخر نهار ديال هاد الدوا"}
function dayBody(date,ds){ // shared empty / loading states
  if(!S.ready)return '<div class="empty">كنجيب الدوا ديالك…</div>';
  if(!S.meds.length)return emptyMeds();
  if(!ds.length)return '<div class="empty">ما كاين حتى دوا ف هاد النهار ✨</div>';
  return null}
const ckBtn=(d,tk)=>'<button class="ck'+(tk?" y":"")+'" data-tick="'+d.key+'" aria-label="'+(tk?"رجع: ما خديتوش":"خديتو")+'">'+(tk?"✓":"")+'</button>';
const exTag=m=>m.example?'<span class="ex">مثال</span>':'';
function alertsHtml(date){const al=alertsFor(date);return al.length?'<div class="alerts">'+al.map(a=>'<div class="alert '+a[0]+'"><span>'+a[1]+'</span><div>'+a[2]+'</div></div>').join("")+'</div>':''}
function renderDay(){({ring:dayRing,box:dayBox,book:dayBook})[P.layout](S.day,dosesOn(S.day))}

const greetTxt=()=>new Date().getHours()<12?"صباح الخير ILY 🩶💎":"مساء الخير ILY 🩶💎";
function dayRing(date,ds){
  const t=todayIso(),st=dayStatus(date)||{taken:0,total:0},hr=new Date().getHours();
  const greet=date===t?greetTxt():dayTitle(date);
  const C=94.25,f=st.total?st.taken/st.total:0;
  let h='<div class="top"><div class="ring-hd"><div><b>'+greet+'</b><span>'+fmtDay(date)+'</span></div><div class="ringc"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--accent-soft)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(C*f).toFixed(1)+' '+C+'"/></svg><div>'+st.taken+'/'+st.total+'</div></div></div>';
  h+='<div class="chips"><button class="ar" data-nav="-7" aria-label="السيمانة اللي فاتت">›</button>'+weekDays().map(x=>'<button class="d'+(x===date?" on":"")+'" data-day="'+x+'">'+DAYS[parse(x).getDay()]+'<b>'+parse(x).getDate()+'</b><i class="'+dayDot(x)+'"></i></button>').join("")+'<button class="ar" data-nav="7" aria-label="السيمانة الجاية">‹</button></div></div>';
  const e=dayBody(date,ds);if(e){app.innerHTML=h+e;return}
  h+=alertsHtml(date);
  if(date===t){const nx=ds.find(d=>!S.log[d.key]&&tMin(d.time)+60>=nowMin());
    if(nx)h+='<div class="hero"><div class="tp">'+ph(nx.med)+'<div style="min-width:0"><small>الدوا الجاي</small><b>'+esc(nx.med.name)+'</b><small>'+esc(amtTxt(nx))+(nx.med.notes?' · '+esc(nx.med.notes):'')+'</small></div><div class="t">'+T(nx.time)+'</div></div><button class="go" data-tick="'+nx.key+'">خديتو ✓</button></div>';
    else h+='<div class="hero"><div class="tp"><div><small>اليوم</small><b>كملتي كلشي ديال اليوم ✓</b><small>الله يشافي</small></div></div></div>'}
  // every dose of the day, in time order, grouped under its time
  const groups={};ds.forEach(d=>(groups[d.time]=groups[d.time]||[]).push(d));
  for(const tm of Object.keys(groups).sort()){
    const g=groups[tm],tk=g.filter(d=>S.log[d.key]).length;
    h+='<div class="rgrp"><div class="lbl2"><span>'+T(tm)+' · '+PERIODS[perIdx(tm)][0].split(" ")[1]+'</span><span>'+tk+'/'+g.length+'</span></div>';
    for(const d of g){const k=S.log[d.key],ms=isMissed(date,d.time,d.key),cn=changeNote(d.med,date);
      h+='<div class="rrow'+(k?" done":ms?" miss":"")+'">'+ph(d.med)+'<div class="tx"><b>'+esc(d.med.name)+exTag(d.med)+'</b><span>'+esc(amtTxt(d))+(d.med.notes?' · '+esc(d.med.notes):'')+'</span>'+(k?'<span class="okt">خديتيه ف '+T(k.at)+'</span>':ms?'<span class="bad">فات الوقت</span>':'')+(cn?'<span class="chg">'+esc(cn)+'</span>':'')+'</div>'+ckBtn(d,k)+'</div>'}
    h+='</div>'}
  app.innerHTML=h;
}

function dayBox(date,ds){
  const t=todayIso(),st=dayStatus(date)||{taken:0,total:0},pd=parse(date),wk=weekDays();
  let h='<div class="top"><div class="greet">'+greetTxt()+'</div><div class="box-hd" style="padding-top:2px"><div><b>'+dayTitle(date)+' '+pd.getDate()+'</b><span>'+MONTHS[pd.getMonth()]+' '+pd.getFullYear()+'</span></div><span>'+st.taken+' من '+st.total+' ✓</span></div>';
  h+='<div class="wkn"><button data-nav="-7">› السيمانة اللي فاتت</button><button data-nav="7">الجاية ‹</button></div><div class="mx"><span></span>'+wk.map(x=>'<button class="'+(x===date?"on":"")+'" data-day="'+x+'">'+DSHORT[parse(x).getDay()]+'<br>'+parse(x).getDate()+'</button>').join("");
  PERIODS.forEach((p,pi)=>{h+='<span>'+p[0].split(" ")[0]+'</span>';
    wk.forEach(x=>{const xs=dosesOn(x).filter(d=>perIdx(d.time)===pi);let c="n";
      if(xs.length){if(xs.every(d=>S.log[d.key]))c="k";else if(xs.some(d=>isMissed(x,d.time,d.key)))c="x";else c="u"}
      h+='<i class="'+c+(x===date?" on":"")+'"></i>'})});
  h+='</div></div>';
  const e=dayBody(date,ds);if(e){app.innerHTML=h+e;return}
  h+=alertsHtml(date);
  const nx=date===t?ds.find(d=>!S.log[d.key]&&tMin(d.time)+60>=nowMin()):null;
  PERIODS.forEach((p,pi)=>{const xs=ds.filter(d=>perIdx(d.time)===pi);
    if(!xs.length){h+='<div class="bx"><div class="lid"><b>'+p[0]+'</b><span>والو</span></div><div class="none">ما كاين حتى دوا</div></div>';return}
    const tk=xs.filter(d=>S.log[d.key]).length,all=tk===xs.length,ms=xs.some(d=>isMissed(date,d.time,d.key));
    const times=[...new Set(xs.map(d=>d.time))];
    h+='<div class="bx'+(all?" done":nx&&xs.includes(nx)?" cur":ms?" miss":"")+'"><div class="lid"><b>'+p[0]+'</b><span>'+T(times[0])+(times.length>1?" – "+T(times[times.length-1]):"")+' · '+(all?"✓ كامل":tk+"/"+xs.length)+'</span></div>';
    for(const d of xs){const k=S.log[d.key],m=isMissed(date,d.time,d.key),cn=changeNote(d.med,date);
      h+='<div class="chip">'+ph(d.med)+'<div class="tx">'+esc(d.med.name)+exTag(d.med)+'<small>'+esc(amtTxt(d))+' · '+T(d.time)+(d.med.notes?' · '+esc(d.med.notes):'')+'</small>'+(m?'<small style="color:var(--bad)">فات الوقت</small>':'')+(cn?'<span class="chg">'+esc(cn)+'</span>':'')+'</div>'+ckBtn(d,k)+'</div>'}
    h+='</div>'});
  app.innerHTML=h;
}

function dayBook(date,ds){
  const st=dayStatus(date)||{taken:0,total:0},pd=parse(date);
  let h='<div class="top"><div class="greet" style="font-family:var(--f-book)">'+greetTxt()+'</div><div class="bk-hd" style="padding-top:4px"><div class="n">'+pd.getDate()+'</div><div><b>'+dayTitle(date)+'</b><span>'+DAYS[pd.getDay()]+' · '+MONTHS[pd.getMonth()]+' '+pd.getFullYear()+'</span></div><div class="pr"><b>'+st.taken+'/'+st.total+'</b><br>خديتي</div></div>';
  h+='<div class="bwk"><button data-nav="-7" aria-label="السيمانة اللي فاتت">›</button>'+weekDays().map(x=>'<button class="'+(x===date?"on":"")+'" data-day="'+x+'">'+DSHORT[parse(x).getDay()]+' '+parse(x).getDate()+'</button>').join("")+'<button data-nav="7" aria-label="السيمانة الجاية">‹</button></div></div>';
  const e=dayBody(date,ds);if(e){app.innerHTML=h+e;return}
  h+=alertsFor(date).map(a=>'<div class="bnote'+(a[0]==="low"?" low":"")+'">'+a[1]+' '+a[2]+'</div>').join("");
  PERIODS.forEach((p,pi)=>{const xs=ds.filter(d=>perIdx(d.time)===pi);if(!xs.length)return;
    h+='<div class="bsec">'+p[0].split(" ")[1]+'</div>';
    for(const d of xs){const tk=S.log[d.key],ms=isMissed(date,d.time,d.key),s=stepFor(d.med,date),cn=changeNote(d.med,date);
      h+='<div class="ln'+(tk?" done":ms?" miss":"")+'"><span class="t">'+T(d.time)+'</span><div style="min-width:0"><b>'+ph(d.med)+'<span>'+esc(d.med.name)+exTag(d.med)+'</span></b><div class="d">'+esc(amtTxt(d))+(d.med.notes?' · '+esc(d.med.notes):'')+(tk?' · خديتيه ف '+T(tk.at):ms?' · فات الوقت':'')+'</div>'+(cn?'<div class="note">'+esc(cn)+'</div>':s&&s.end?'<div class="d">هاد الدوز حتى '+short(s.end)+'</div>':'')+'</div>'+ckBtn(d,tk)+'</div>'}});
  app.innerHTML=h;
}
function emptyMeds(){return '<div class="empty"><div style="font-size:2rem">💊</div><div>ما زال ما زدتي حتى دوا.</div><div class="hint">صيفط تصويرة الدوا مع الدوز والوقت ف الشات وأنا نزيدو، ولا زيدو بيدك هنا.</div><button class="btn" data-add="1">زيد دوا</button></div>'}
function renderMonth(){
  const [y,m]=S.month.split("-").map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),t=todayIso();
  let h='<div class="top"><div class="mhead"><button class="iconbtn" data-mon="-1" aria-label="الشهر اللي فات">›</button><h2>'+MONTHS[m-1]+' '+y+'</h2><button class="iconbtn" data-mon="1" aria-label="الشهر الجاي">‹</button></div><div class="grid">'+DAYS.map(d=>'<div class="dn">'+d.slice(0,3)+'</div>').join("")+'</div></div><div class="grid">';

  h+='</div><div class="legend"><span><i style="background:var(--ok)"></i>خديتي كلشي</span><span><i style="background:var(--warn)"></i>خديتي شي</span><span><i style="background:var(--bad)"></i>ما خديتي والو</span><span><i style="background:var(--accent-soft)"></i>جاي</span><span style="color:var(--gold)">◆ الدوز كيتبدل</span></div>';
  app.innerHTML=h;

  const t=todayIso();
  let h='<div class="top"><div class="toprow"><h1>الدوا ديالي</h1><button class="btn small" data-add="1">+ زيد دوا</button></div></div>';

  app.innerHTML=h+'</div>';
}
function renderAlarms(){
  let h='<div class="top"><div class="toprow"><h1>الإعدادات</h1></div></div><div class="sec">';
  h+='<div class="panel"><h3>🎨 اللون</h3><div class="opts">'+SKINS.map(k=>'<button class="opt'+(P.skin===k[0]?" on":"")+'" data-skin="'+k[0]+'"><div class="sw">'+k[3].map(c=>'<i style="background:'+c+'"></i>').join("")+'</div><b>'+k[1]+'</b><span>'+k[2]+'</span></button>').join("")+'</div>';
  h+='<div class="seg">'+[["auto","تلقائي"],["light","فاتح"],["dark","غامق"]].map(m=>'<button class="'+(P.mode===m[0]?"on":"")+'" data-mode="'+m[0]+'"'+(P.skin==="lil"?" disabled":"")+'>'+m[1]+'</button>').join("")+'</div></div>';
  h+='<div class="panel"><h3>🔤 الخط</h3><div class="opts">'+FONTS.map(f=>'<button class="opt'+(P.font===f[0]?" on":"")+'" data-font="'+f[0]+'"><b style="font-size:1.35rem;line-height:1.3'+(f[3]?';font-family:'+f[3].replace(/"/g,"&quot;"):'')+'">صباح الخير 💎</b><span>'+f[1]+' · '+f[2]+'</span></button>').join("")+'</div></div>';
  h+='<div class="panel"><h3>📐 التصميم</h3><div class="opts">'+LAYOUTS.map(k=>'<button class="opt'+(P.layout===k[0]?" on":"")+'" data-layout="'+k[0]+'">'+miniPrev(k[0])+'<b>'+k[1]+'</b><span>'+k[2]+'</span></button>').join("")+'</div><p>التلاتة فيهم نفس الحوايج. بدل وشوف ف "نهار" شنو عجبك.</p></div>';
  h+='<div class="panel"><h3>🔔 تنبيهات ف الآيفون</h3><p>باش يصوني ليك التليفون ف وقت الدوا حتى إلا كان التطبيق مسدود، دخل كاع المواعيد ل Calendar ديال الآيفون. كل دوا كيتزاد بالدوز ديالو، وملي كيتبدل الدوز كيتبدل حتى التنبيه.</p>'+
    '<ol style="margin:0;padding-inline-start:20px;color:var(--muted);font-size:.9rem;display:grid;gap:4px"><li>ورك على الزر لتحت وسجل الفيشي.</li><li>حلو من Fichiers (Files) وورك على "Ajouter tout" / "Add All".</li><li>إلا بدلتي شي دوا من بعد، مسح الكالاندريي القديم "الدوا" وعاود هاد الخطوة.</li></ol>'+
    ((S.dl||S.local)?'<button class="btn" id="ics">سجل التنبيهات (ics.)</button>':'<p>التسجيل ما خدامش هنا. حل الصفحة من Safari ف الآيفون.</p>')+'</div>';
  h+='<div class="panel"><h3>📲 زيدها للشاشة</h3><p>ف Safari: ورك على زر المشاركة <b>⬆︎</b> ← "Sur l\'écran d\'accueil" / "Add to Home Screen". غادي تولي بحال تطبيق.</p></div>';
  h+='<div class="panel"><h3>⏰ وهو مفتوح</h3><p>ملي يكون التطبيق محلول ويوصل وقت شي دوا، كيبان ليك ميساج لفوق.</p></div></div>';

}

function miniPrev(l){if(l==="ring")return '<div class="mini"><i style="height:16px;background:var(--accent)"></i><div style="display:grid;grid-template-columns:1fr 1fr;gap:3px"><i style="height:16px"></i><i style="height:16px"></i></div></div>';
  if(l==="box")return '<div class="mini"><i style="height:10px;border:1px solid var(--accent);background:transparent"></i><i style="height:10px;border:1px solid var(--accent);background:transparent"></i><i style="height:10px;border:1px solid var(--accent);background:transparent"></i></div>';
  return '<div class="mini" style="background:var(--surface)"><i style="height:3px;background:var(--line)"></i><i style="height:3px;background:var(--line)"></i><i style="height:3px;background:var(--line)"></i><i style="height:3px;background:var(--line)"></i></div>'}
/* ---------- editor ---------- */
const sheet=document.getElementById("sheet");let E=null;
function openEditor(id){
  if(S.local)return toast("التبديل ديال الدوا كيدار من عند علي. شوف معاه.");
  const m=id?S.meds.find(x=>x.id===id):null;
  E=m?JSON.parse(JSON.stringify(m)):{id:"m"+Date.now().toString(36),name:"",notes:"",steps:[{start:todayIso(),end:"",doses:[{time:"08:00",amount:"1",unit:"حبة"}]}]};
  E.isNew=!m;E.photo=S.photos[E.id]||null;E.photoChanged=false;E.confirmDel=false;drawEditor();sheet.hidden=false;sheet.scrollTop=0;
}
function drawEditor(){
  let h='<div class="inner"><div class="toprow"><h1>'+(E.isNew?"دوا جديد":"بدل الدوا")+'</h1><button class="iconbtn" data-close="1" aria-label="سد">✕</button></div>';
  h+='<div class="photo-pick"><div class="ph">'+(E.photo?'<img alt="" src="'+E.photo+'">':'📷')+'</div><label class="btn ghost" for="f-photo">'+(E.photo?"بدل التصويرة":"زيد تصويرة")+'</label><input id="f-photo" type="file" accept="image/*" hidden></div>';
  h+='<label class="f">سمية الدوا<input class="inp" id="f-name" value="'+esc(E.name)+'" placeholder="مثلا: Doliprane 1000mg"></label>';
  h+='<label class="f">ملاحظات<input class="inp" id="f-notes" value="'+esc(E.notes||"")+'" placeholder="قبل الماكلة، مع الما…"></label>';
  h+='<label class="f">شحال باقي عندك (اختياري)<input class="inp" id="f-stock" inputmode="decimal" value="'+(typeof E.stock==="number"?E.stock:"")+'" placeholder="مثلا: 30"></label>';
  h+='<h3 style="font-size:1.1rem">المراحل ديال الدوز</h3><div class="hint">كل مرحلة عندها تاريخ البداية والنهاية والدوز ديالها. ملي كيتبدل الدوز، زيد مرحلة جديدة.</div>';
  E.steps.forEach((s,i)=>{
    h+='<div class="stepbox"><div class="toprow"><b>المرحلة '+(i+1)+'</b>'+(E.steps.length>1?'<button class="x" data-delstep="'+i+'" aria-label="مسح المرحلة">🗑</button>':'')+'</div><div class="row2"><label class="f">من<input class="inp" type="date" id="s'+i+'-start" data-s="'+i+'" data-k="start" value="'+s.start+'"></label><label class="f">حتى (خليه خاوي إلا بلا نهاية)<input class="inp" type="date" id="s'+i+'-end" data-s="'+i+'" data-k="end" value="'+(s.end||"")+'"></label></div>';
    s.doses.forEach((d,j)=>{h+='<div class="drow"><label class="f">الساعة<input class="inp" type="time" id="d'+i+'-'+j+'-time" data-s="'+i+'" data-d="'+j+'" data-k="time" value="'+d.time+'"></label><label class="f">شحال<input class="inp" inputmode="decimal" id="d'+i+'-'+j+'-amount" data-s="'+i+'" data-d="'+j+'" data-k="amount" value="'+esc(d.amount)+'"></label><label class="f">شنو<select class="inp" id="d'+i+'-'+j+'-unit" data-s="'+i+'" data-d="'+j+'" data-k="unit">'+UNITS.concat(UNITS.includes(d.unit)?[]:[d.unit]).map(u=>'<option'+(u===d.unit?" selected":"")+'>'+esc(u)+'</option>').join("")+'</select></label>'+(s.doses.length>1?'<button class="x" data-deldose="'+i+'-'+j+'" aria-label="مسح">✕</button>':'<span></span>')+'</div>'});
    h+='<button class="btn ghost small" data-adddose="'+i+'">+ زيد وقت</button></div>'});
  h+='<button class="btn ghost" data-addstep="1">+ زيد مرحلة (تبديل الدوز)</button>';
  h+='<div id="err" class="alert low" hidden></div><div class="actions"><button class="btn" data-save="1" style="flex:1">سجل</button>'+(E.isNew?'':'<button class="btn danger" data-del="1">'+(E.confirmDel?"متأكد؟ ورك باش تمسح":"مسح الدوا")+'</button>')+'</div></div>';
  sheet.innerHTML=h;
}
sheet.addEventListener("input",e=>{const el=e.target;
  if(el.id==="f-name")E.name=el.value;else if(el.id==="f-notes")E.notes=el.value;else if(el.id==="f-stock")E.stockTxt=el.value;
  else if(el.dataset.s!=null){const s=E.steps[+el.dataset.s];if(el.dataset.d!=null)s.doses[+el.dataset.d][el.dataset.k]=el.value;else s[el.dataset.k]=el.value}});
sheet.addEventListener("change",async e=>{if(e.target.id!=="f-photo")return;const f=e.target.files[0];if(!f)return;
  try{E.photo=await shrink(f);E.photoChanged=true;drawEditor()}catch(err){toast("ما قدرتش نقرا التصويرة. جرب وحدة أخرى.")}});
sheet.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.close){sheet.hidden=true;return}
  if(b.dataset.adddose){const s=E.steps[+b.dataset.adddose];const l=s.doses[s.doses.length-1];s.doses.push({time:"20:00",amount:l?l.amount:"1",unit:l?l.unit:"حبة"});drawEditor();return}
  if(b.dataset.deldose){const[i,j]=b.dataset.deldose.split("-").map(Number);E.steps[i].doses.splice(j,1);drawEditor();return}
  if(b.dataset.delstep){E.steps.splice(+b.dataset.delstep,1);drawEditor();return}
  if(b.dataset.addstep){const l=E.steps[E.steps.length-1];let st=l.end?addDays(l.end,1):addDays(l.start,7);if(!l.end)l.end=addDays(st,-1);
    E.steps.push({start:st,end:"",doses:l.doses.map(d=>({...d}))});drawEditor();return}
  if(b.dataset.del){if(!E.confirmDel){E.confirmDel=true;drawEditor();return}
    try{await S.db.doc("meds/"+E.id).delete();await S.db.doc("photos/"+E.id).delete().catch(()=>{});sheet.hidden=true;toast("تمسح.")}catch(err){showErr("ما تمسحش. عاود جرب.")}return}
  if(b.dataset.save)save();
});
function showErr(t){const el=document.getElementById("err");el.textContent=t;el.hidden=false}
async function save(){
  if(!E.name.trim())return showErr("كتب سمية الدوا.");
  for(const s of E.steps){if(!s.start)return showErr("كل مرحلة خاصها تاريخ البداية.");if(s.end&&s.end<s.start)return showErr("تاريخ النهاية خاصو يكون من بعد البداية.");
    for(const d of s.doses)if(!d.time||!String(d.amount).trim())return showErr("عمر الساعة والدوز ف كل سطر.")}
  if(!S.db)return showErr("ما قدرتش نسجل دابا. عاود حل الصفحة.");
  const steps=E.steps.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(s=>({start:s.start,end:s.end||null,doses:s.doses.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(d=>({time:d.time,amount:String(d.amount).trim(),unit:d.unit}))}));
  const doc={name:E.name.trim(),notes:(E.notes||"").trim(),steps,updatedAt:Date.now()};
  if(E.example)doc.example=true;
  const st=E.stockTxt!=null?E.stockTxt:(typeof E.stock==="number"?String(E.stock):"");
  doc.stock=st.trim()===""?null:parseFloat(st);if(Number.isNaN(doc.stock))doc.stock=null;
  try{await S.db.doc("meds/"+E.id).set(doc);if(E.photoChanged)await S.db.doc("photos/"+E.id).set({data:E.photo});sheet.hidden=true;toast("تسجل ✓")}
  catch(err){showErr(err&&err.code==="quota_exceeded"?"المساحة عامرة. صغر التصويرة ولا مسح شي دوا قديم.":"ما تسجلش. عاود جرب.")}
}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const M=420,sc=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};img.src=r.result};r.readAsDataURL(file)})}

/* ---------- interactions ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;if(S.view==="day"&&b.dataset.v==="day")S.day=S.day||todayIso();try{localStorage.setItem("dwa.view",S.view)}catch(err){}render();window.scrollTo(0,0)});
app.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.day){S.day=b.dataset.day;S.view="day";render();return}
  if(b.dataset.nav){S.day=addDays(S.day,+b.dataset.nav);render();return}
  if(b.dataset.mon){const[y,m]=S.month.split("-").map(Number);const d=new Date(y,m-1+(+b.dataset.mon),1);S.month=d.getFullYear()+"-"+pad(d.getMonth()+1);render();return}
  if(b.dataset.add){openEditor(null);return}
  if(b.dataset.edit){openEditor(b.dataset.edit);return}
  if(b.dataset.tick)toggle(b.dataset.tick);
  if(b.id==="ics")exportIcs();
  if(b.dataset.skin){P.skin=b.dataset.skin;applyPrefs();render();return}
  if(b.dataset.layout){P.layout=b.dataset.layout;applyPrefs();render();toast("تبدل التصميم. شوف ف نهار.");return}
  if(b.dataset.font){P.font=b.dataset.font;applyPrefs();render();return}
  if(b.dataset.mode){P.mode=b.dataset.mode;applyPrefs();render();return}
});
async function toggle(key){
  if(!S.db)return toggleLocal(key);
  const[date,medId]=key.split("_");const m=S.meds.find(x=>x.id===medId);const ds=dosesOn(date).find(d=>d.key===key);
  const amt=parseFloat(ds&&ds.amount)||0,was=S.log[key];
  try{
    if(was){delete S.log[key];render();await S.db.doc("log/"+key).delete()}
    else{const d=new Date(),at=pad(d.getHours())+":"+pad(d.getMinutes());S.log[key]={at};render();await S.db.doc("log/"+key).set({date,medId,time:ds?ds.time:"",at,ts:Date.now()})}
    if(m&&typeof m.stock==="number"&&amt){await S.db.doc("meds/"+m.id).update({stock:Math.max(0,+(m.stock+(was?amt:-amt)).toFixed(2))})}
  }catch(err){toast("ما تسجلش. عاود جرب.")}
}
let tt;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,3500)}

/* ---------- ics export ---------- */
function exportIcs(){
  const t=todayIso(),stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//dwa//ar","CALSCALE:GREGORIAN","X-WR-CALNAME:الدوا"];
  let n=0;
  for(const m of S.meds)for(const s of m.steps||[]){if(s.end&&s.end<t)continue;const st=s.start<t?t:s.start;
    for(const d of s.doses||[]){n++;const ds=st.replace(/-/g,"")+"T"+d.time.replace(":","")+"00";
      L.push("BEGIN:VEVENT","UID:"+m.id+"-"+s.start+"-"+d.time.replace(":","")+"@dwa","DTSTAMP:"+stamp,"DTSTART:"+ds,"DURATION:PT10M",
        "RRULE:FREQ=DAILY"+(s.end?";UNTIL="+s.end.replace(/-/g,"")+"T235959":""),
        "SUMMARY:💊 "+icsEsc(m.name)+" - "+icsEsc(amtTxt(d)),"DESCRIPTION:"+icsEsc("وقت الدوا: "+amtTxt(d)+(m.notes?" - "+m.notes:"")),
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("وقت الدوا: "+m.name+" "+amtTxt(d)),"TRIGGER:PT0M","END:VALARM","END:VEVENT")}}
  L.push("END:VCALENDAR");
  if(!n)return toast("ما كاين حتى دوا جاي باش نزيد ليه تنبيه.");
  if(!S.dl){const u=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));const a=document.createElement("a");a.href=u;a.download="dwa-tanbihat.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return}
  S.dl.save({filename:"dwa-tanbihat.ics",data:new Blob([L.join("\r\n")],{type:"text/calendar"})}).then(()=>toast("تسجل. حلو من Fichiers.")).catch(e=>{if(e&&e.code!=="declined")toast("ما تسجلش. عاود جرب.")});
}
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");

/* ---------- live reminder while open ---------- */
const shown=new Set();
setInterval(()=>{if(!S.ready||document.hidden)return;const t=todayIso(),n=nowMin();
  for(const d of dosesOn(t)){const k=d.key;if(S.log[k]||shown.has(k))continue;const dm=tMin(d.time);
    if(n>=dm&&n<dm+15){shown.add(k);toast("⏰ وقت الدوا: "+d.med.name+" · "+amtTxt(d));try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}if(S.view==="day"&&S.day===t)render()}}},30000);
setInterval(()=>{const t=todayIso();if(S.lastToday&&S.lastToday!==t&&S.day===S.lastToday)S.day=t;S.lastToday=t;if(S.view==="day")render()},60000);
S.lastToday=todayIso();

/* ---------- data ---------- */
render();
/* offline copy: used when the viewer has no Claude account (shared link). Ticks are kept on this phone only. */
async function decryptSnap(enc,pass){
  const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadLocal(){
  let snap={meds:[],photos:{}};try{snap=JSON.parse(document.getElementById("snap").textContent)}catch(e){}
  if(snap.enc){
    let pass="";try{pass=localStorage.getItem("dwa.pass")||""}catch(e){}
    if(pass){try{snap=await decryptSnap(snap,pass)}catch(e){pass=""}}
    if(!pass){document.getElementById("tabs").hidden=true;
      app.innerHTML='<div class="empty" style="margin-top:20vh"><div style="font-size:2rem">🔒</div><h2>'+greetTxt()+'</h2><label class="f" for="pw">دخلي الكود</label><input class="inp" id="pw" type="password" autocomplete="current-password" style="text-align:center;font-size:1.2rem"><button class="btn" id="pwgo">دخول</button><div class="hint" id="pwerr"></div></div>';
      const go=async()=>{const v=document.getElementById("pw").value.trim();try{const d=await decryptSnap(snap,v);try{localStorage.setItem("dwa.pass",v)}catch(e){}document.getElementById("tabs").hidden=false;finishLocal(d)}catch(e){document.getElementById("pwerr").textContent="الكود غالط، عاودي."}};
      document.getElementById("pwgo").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};return}
  }
  finishLocal(snap);
}
function finishLocal(snap){
  S.local=true;S.meds=snap.meds.sort((a,b)=>(a.name||"").localeCompare(b.name||""));S.photos=snap.photos||{};
  try{S.log=JSON.parse(localStorage.getItem("dwa.log")||"{}")}catch(e){S.log={}}
  S.ready=true;render();
}
function toggleLocal(key){
  if(S.log[key])delete S.log[key];else{const d=new Date();S.log[key]={at:pad(d.getHours())+":"+pad(d.getMinutes())}}
  try{localStorage.setItem("dwa.log",JSON.stringify(S.log))}catch(e){toast("ما قدرتش نسجل ف هاد التليفون.")}
  render();
}
(async()=>{
  const db=window.claude?await window.claude.use("db"):null;
  S.dl=window.claude?await window.claude.use("downloads"):null;
  if(!db){loadLocal();return}
  S.db=db;
  db.collection("meds").onSnapshot(q=>{S.meds=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));S.ready=true;render()},()=>{S.ready=true;render()});
  db.collection("photos").onSnapshot(q=>{S.photos={};q.docs.forEach(d=>S.photos[d.id]=d.data().data);render()});
  db.collection("log").where("date",">=",addDays(todayIso(),-120)).onSnapshot(q=>{S.log={};q.docs.forEach(d=>S.log[d.id]=d.data());render()});
})();
