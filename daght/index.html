<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ضغط ILY"><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#b23a5a">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json">
<title>الضغط ديال ILY 💎♥️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Standalone blood pressure log for ILY: readings live in this phone's localStorage (dwa.bp, shared with the Dwa app on the same site) */
:root{--bg:#fbf3f2;--surface:#fff;--ink:#46202a;--muted:#86606a;--line:#efdcdc;--accent:#b23a5a;--accent-soft:#f7dfe5;--gold:#b7791f;
  --ok:#1f8a4c;--ok-soft:#dcf2e4;--bad:#c2412d;--bad-soft:#fbe3de;--warn:#a86a00;--warn-soft:#fbefd4;
  --display:"El Messiri",system-ui,sans-serif;--body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a0f12;--surface:#26161b;--ink:#f6e6ea;--muted:#c09ba4;--line:#3d252c;--accent:#f0839f;--accent-soft:#4a2230;--gold:#e8b25c;
  --ok:#4cc985;--ok-soft:#14321f;--bad:#f07a66;--bad-soft:#3a1a15;--warn:#e9b04c;--warn-soft:#3a2c10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0f12;--surface:#26161b;--ink:#f6e6ea;--muted:#c09ba4;--line:#3d252c;--accent:#f0839f;--accent-soft:#4a2230;--gold:#e8b25c;
  --ok:#4cc985;--ok-soft:#14321f;--bad:#f07a66;--bad-soft:#3a1a15;--warn:#e9b04c;--warn-soft:#3a2c10;color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}
.greet{padding-top:14px;font-weight:600;color:var(--accent)}
.fab{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;max-width:528px;margin:0 auto;font-size:1.1rem;padding:16px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toprow h1{font-size:1.5rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;font-size:1.1rem}
.alert{border-radius:12px;padding:10px 12px;font-size:.92rem;display:flex;gap:8px;align-items:flex-start}
.alert.low{background:var(--bad-soft);color:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.85rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.list{display:grid;gap:10px}
.sec{display:grid;gap:12px;margin-block:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.panel p{margin:0;color:var(--muted);font-size:.9rem}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet .inner{max-width:560px;margin:0 auto;padding-inline:16px;display:grid;gap:14px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;text-align:center;max-width:528px;margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 4px;font-size:.9rem}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.seg.r4{grid-template-columns:repeat(4,1fr)}
/* ---- blood pressure log ---- */
.bpsum{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bpv{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.bpsum .bpv{font-size:2.2rem;line-height:1;color:var(--accent)}
.bpsum small{font-size:.9rem;color:var(--muted);font-family:var(--body);font-weight:500}
.cat{font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.cat.ok{background:var(--ok-soft);color:var(--ok)}.cat.warn{background:var(--warn-soft);color:var(--warn)}.cat.bad{background:var(--bad-soft);color:var(--bad)}
.bpr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.bpr .bpv{font-size:1.45rem}
.bpr .hint{overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart .g{stroke:var(--line);stroke-width:1}.chart .lim{stroke:var(--bad);stroke-width:1;stroke-dasharray:4 4;opacity:.6}
.chart .s{stroke:var(--accent);fill:none;stroke-width:2.5}.chart .d{stroke:var(--gold);fill:none;stroke-width:2.5}
.chart .sp{fill:var(--accent)}.chart .dp{fill:var(--gold)}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--body)}
.seg.r4{grid-template-columns:repeat(4,1fr)}
.big2{font-size:1.6rem;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.live{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.live .bpv{font-size:2.4rem;color:var(--accent);line-height:1}
.wheels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wcol{display:grid;gap:4px;text-align:center;font-size:.78rem;color:var(--muted);line-height:1.3}
.wbox{position:relative}
.wbox::after{content:"";position:absolute;inset-inline:6px;top:80px;height:40px;border-radius:10px;background:var(--accent-soft);z-index:0;pointer-events:none}
.wheel{position:relative;z-index:1;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;border:1px solid var(--line);border-radius:14px;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .sp{height:80px}
.wi{height:40px;display:grid;place-items:center;scroll-snap-align:center;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;user-select:none}
.wi.on{color:var(--accent);font-size:1.75rem;font-weight:700}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--ink)}
.nchips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* doctor report */
.rep{background:#fff;color:#111;border-radius:var(--r);padding:16px;margin-top:12px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.4}
.rep h2{font-family:inherit;font-size:1.2rem;margin:0 0 2px}
.rep .meta{color:#444;margin:2px 0}
.rep .tw{overflow-x:auto;margin-top:10px}
.rep table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.rep th,.rep td{border:1px solid #bbb;padding:4px 4px;text-align:center;vertical-align:top}
.rep th{background:#f0f0f0;font-size:11px;font-weight:600}
.rep td.n{text-align:start}
.rep .hi{font-weight:700;color:#b00020}
.rep .chart text{fill:#444}.rep .chart .g{stroke:#ddd}.rep .chart .s{stroke:#111}.rep .chart .d{stroke:#888}.rep .chart .sp{fill:#111}.rep .chart .dp{fill:#888}.rep .chart .lim{stroke:#b00020}
.rep .key{display:flex;gap:14px;font-size:11px;color:#444;margin-top:4px}
.rep .key i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-inline-end:4px}
@media print{
  @page{margin:12mm}
  html,body{background:#fff!important}
  .tabs,.toast,.noprint{display:none!important}
  #app{padding:0;max-width:none}
  .rep{border-radius:0;padding:0;margin:0}
  .rep tr{break-inside:avoid}
  .rep{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rep .chart{max-width:140mm}
  .rep .tw{overflow:visible}
}

</style></head><body>
<div id="app" dir="rtl" lang="ar"></div>
<button class="btn fab" id="fab" data-bpadd="1">+ قياس جديد</button>
<div id="sheet" class="sheet" dir="rtl" hidden></div>
<div id="toast" class="toast" dir="rtl" hidden></div>
<script>
const DAYS=["الحد","الاتنين","التلات","لاربع","الخميس","الجمعة","السبت"];
const MONTHS=["يناير","فبراير","مارس","أبريل","ماي","يونيو","يوليوز","غشت","شتنبر","أكتوبر","نونبر","دجنبر"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=()=>iso(new Date());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDay=s=>{const d=parse(s);return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]};
const T=t=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return (h%12||12)+":"+pad(m)+" "+(h<12?"ص":"م")};
const S={view:"bp",bp:[],bpRange:30,db:null,dl:null,local:true};
try{const r=localStorage.getItem("dwa.bprange");if(r!=null)S.bpRange=+r}catch(e){}
try{S.bp=JSON.parse(localStorage.getItem("dwa.bp")||"[]")}catch(e){S.bp=[]}
const app=document.getElementById("app"),sheet=document.getElementById("sheet");
function render(){document.getElementById("fab").hidden=S.view!=="bp";(S.view==="bprep"?renderBpReport:renderBp)();
  if(S.view==="bp"){const h=new Date().getHours();app.insertAdjacentHTML("afterbegin",'<div class="greet">'+(h<17?"صباح الخير":"مساء الخير")+' ILY 🩶💎</div>')}}
let tt;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,3500)}
function showErr(t){const el=document.getElementById("err");el.textContent=t;el.hidden=false}
/* ---------- blood pressure log ---------- */
// Readings: {id,date "YYYY-MM-DD",time "HH:MM",sys,dia,pulse|null,note,ts}. Stored in db collection "bp", or in localStorage "dwa.bp" on the offline copy.
// Categories follow the European (ESC) office thresholds; shown as a hint only.
function bpCat(r){const s=r.sys,d=r.dia;
  if(s>=180||d>=110)return["bad","طالع بزاف، عيط للطبيب"];
  if(s>=140||d>=90)return["bad","طالع"];
  if(s>=130||d>=85)return["warn","فوق شوية"];
  if(s<90||d<60)return["warn","هابط"];
  return["ok","مزيان"]}
const bpHigh=r=>r.sys>=140||r.dia>=90;
const bpKey=r=>r.date+" "+r.time;
const frDate=s=>{const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const BPR=[[7,"7 أيام"],[30,"شهر"],[90,"3 شهور"],[0,"كلشي"]];
function bpRows(){const from=S.bpRange?addDays(todayIso(),-S.bpRange+1):"";return S.bp.filter(r=>r.date>=from).sort((a,b)=>bpKey(b).localeCompare(bpKey(a)))}
function bpAvg(rows){if(!rows.length)return null;const av=k=>{const v=rows.map(r=>r[k]).filter(x=>typeof x==="number");return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
  return{sys:av("sys"),dia:av("dia"),pulse:av("pulse")}}
function bpChart(rows){ // rows newest first; drawn oldest → newest, left to right
  const r=rows.slice().reverse();if(r.length<2)return"";
  const W=320,H=150,L=30,R=8,Tp=8,B=22;
  const vals=r.flatMap(x=>[x.sys,x.dia]),lo=Math.min(50,Math.floor(Math.min(...vals)/10)*10),hi=Math.max(160,Math.ceil(Math.max(...vals)/10)*10);
  const X=i=>L+(W-L-R)*(r.length===1?.5:i/(r.length-1)),Y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  let g="";for(let v=lo;v<=hi;v+=hi-lo>120?40:20)g+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-4)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  g+='<line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(140)+'" y2="'+Y(140)+'"/><line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(90)+'" y2="'+Y(90)+'"/>';
  const line=(k,c)=>'<polyline class="'+c+'" points="'+r.map((x,i)=>X(i).toFixed(1)+","+Y(x[k]).toFixed(1)).join(" ")+'"/>'+(r.length<=40?r.map((x,i)=>'<circle class="'+c+'p" cx="'+X(i).toFixed(1)+'" cy="'+Y(x[k]).toFixed(1)+'" r="2.6"/>').join(""):"");
  g+=line("sys","s")+line("dia","d");
  g+='<text x="'+L+'" y="'+(H-6)+'">'+frDate(r[0].date).slice(0,5)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+frDate(r[r.length-1].date).slice(0,5)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="رسم ديال الضغط">'+g+'</svg>'}
function renderBp(){
  let h='<div class="top"><div class="toprow"><h1>الضغط ديال ILY 💎♥️</h1></div>'+
    (S.bp.length?'<div class="seg r4">'+BPR.map(x=>'<button class="'+(S.bpRange===x[0]?"on":"")+'" data-bprange="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>':'')+'</div>';
  if(!S.bp.length){app.innerHTML=h+'<div class="empty"><div style="font-size:2rem">🩺</div><div>ما زال ما سجلتي حتى قياس.</div><div class="hint">قيسي الضغط وكتبي الرقم الفوقاني (الانقباضي) والتحتاني (الانبساطي)، والنبض إلا بغيتي. من بعد تقدري تطبعي الجدول ولا تصيفطيه للطبيب.</div><button class="btn" data-bpadd="1">زيد قياس</button></div>';return}
  const rows=bpRows(),a=bpAvg(rows);
  h+='<div class="sec">';
  if(a){const c=bpCat(a);h+='<div class="panel"><h3>📊 المعدل ('+rows.length+' قياس)</h3><div class="bpsum"><span class="bpv">'+a.sys+'/'+a.dia+'</span><small>mmHg'+(a.pulse?' · نبض '+a.pulse:'')+'</small><span class="cat '+c[0]+'">'+c[1]+'</span></div>'+bpChart(rows)+
    (rows.length>1?'<div class="legend"><span><i style="background:var(--accent)"></i>الانقباضي (الفوق)</span><span><i style="background:var(--gold)"></i>الانبساطي (التحت)</span><span style="color:var(--bad)">- - 140 / 90</span></div>':'')+'</div>';}
  h+='<button class="btn" data-bprep="1">🖨️ الورقة ديال الطبيب</button>';
  if(!rows.length)h+='<div class="empty">ما كاين حتى قياس ف هاد المدة.</div>';
  let last="";h+='<div class="list">';
  for(const r of rows){if(r.date!==last){last=r.date;h+='<h3 style="font-size:.95rem;color:var(--muted);margin-top:6px">'+fmtDay(r.date)+'</h3>'}
    const c=bpCat(r);h+='<button class="bpr" data-bp="'+r.id+'"><span class="bpv">'+r.sys+'/'+r.dia+'</span><div style="min-width:0"><div>'+T(r.time)+(r.pulse?' · 💓 '+r.pulse:'')+'</div>'+(r.note?'<div class="hint">'+esc(r.note)+'</div>':'')+'</div><span class="cat '+c[0]+'">'+c[1]+'</span></button>'}
  h+='</div><p class="hint">التصنيف غير باش تعرفي تقريبا. الطبيب هو اللي كيقرر.'+' القياسات كيتسجلو ف هاد التليفون بوحدو.'+'</p></div>';
  app.innerHTML=h}
function bpReportHtml(rows){
  const asc=rows.slice().reverse(),a=bpAvg(rows),hi=rows.filter(bpHigh).length;
  let h='<div class="rep" dir="ltr" lang="fr"><h2>Relevé de tension artérielle <span dir="rtl" lang="ar" style="font-weight:500">· جدول قياس الضغط</span></h2><p class="meta"><b>ILY 💎♥️</b></p>';
  if(asc.length)h+='<p class="meta">Période : '+frDate(asc[0].date)+' → '+frDate(asc[asc.length-1].date)+' · '+rows.length+' mesures</p>';
  if(a)h+='<p class="meta"><b>Moyenne : '+a.sys+'/'+a.dia+' mmHg</b>'+(a.pulse?' · Pouls moyen : '+a.pulse+' bpm':'')+' · Mesures ≥ 140/90 : '+hi+'</p>';
  if(asc.length>1)h+=bpChart(rows)+'<div class="key"><span><i style="background:#111"></i>Systolique</span><span><i style="background:#888"></i>Diastolique</span><span><i style="background:#b00020"></i>140 / 90</span></div>';
  h+='<div class="tw"><table><thead><tr><th>Date</th><th>Heure</th><th>Sys.<br>الانقباضي</th><th>Dia.<br>الانبساطي</th><th>Pouls<br>النبض</th><th>Remarque<br>ملاحظة</th></tr></thead><tbody>';
  for(const r of asc)h+='<tr><td style="white-space:nowrap">'+frDate(r.date).replace(/\/(\d\d)(\d\d)$/,"/$2")+'</td><td>'+r.time+'</td><td class="'+(r.sys>=140?"hi":"")+'">'+r.sys+'</td><td class="'+(r.dia>=90?"hi":"")+'">'+r.dia+'</td><td>'+(r.pulse||"")+'</td><td class="n" dir="auto">'+esc(r.note||"")+'</td></tr>';
  return h+'</tbody></table></div><p class="meta" style="margin-top:8px;font-size:11px">mmHg · Valeurs en gras rouge : ≥ 140 systolique ou ≥ 90 diastolique.</p></div>'}
function renderBpReport(){
  const rows=bpRows();
  let h='<div class="top noprint"><div class="toprow"><button class="iconbtn" data-bpback="1" aria-label="رجع">›</button><h1 style="flex:1">ورقة الطبيب · ILY 💎♥️</h1></div><div class="seg r4">'+BPR.map(x=>'<button class="'+(S.bpRange===x[0]?"on":"")+'" data-bprange="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>'+
    '<div class="actions"><button class="btn" data-bpprint="1" style="flex:1">🖨️ طبع / PDF</button><button class="btn ghost" data-bpshare="1" style="flex:1">📤 صيفط</button><button class="btn ghost" data-bpcsv="1">Excel</button></div>'+
    '<p class="hint" style="margin:0">ف الآيفون: "طبع" كيحل ورقة، تقدري تطبعيها ولا تسجليها PDF من زر المشاركة. ولا غير ورّي هاد الصفحة للطبيب ولا خدي ليها سكرين.</p></div>';
  app.innerHTML=h+(rows.length?bpReportHtml(rows):'<div class="empty">ما كاين حتى قياس ف هاد المدة.</div>')}
function bpText(rows){const asc=rows.slice().reverse(),a=bpAvg(rows);
  return "Tension artérielle / جدول الضغط · ILY 💎♥️\n"+(a?"Moyenne: "+a.sys+"/"+a.dia+" mmHg"+(a.pulse?" · Pouls "+a.pulse:"")+"\n":"")+"\n"+
    asc.map(r=>frDate(r.date)+" "+r.time+"  "+r.sys+"/"+r.dia+(r.pulse?"  P "+r.pulse:"")+(r.note?"  · "+r.note:"")).join("\n")}
function bpCsv(rows){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  return "﻿"+["Date;Heure;Systolique;Diastolique;Pouls;Remarque"].concat(rows.slice().reverse().map(r=>[frDate(r.date),r.time,r.sys,r.dia,r.pulse||"",q(r.note||"")].join(";"))).join("\r\n")}
function saveFile(name,blob){
  if(S.dl)return S.dl.save({filename:name,data:blob}).then(()=>toast("تسجل. حليه من Fichiers.")).catch(e=>{if(e&&e.code!=="declined")toast("ما تسجلش. عاود جرب.")});
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function bpShare(){const rows=bpRows();if(!rows.length)return toast("ما كاين والو باش نصيفط.");const text=bpText(rows);
  if(navigator.share){try{await navigator.share({title:"Tension artérielle",text});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(text);toast("تكوبى. لصقيه ف واتساب ولا ميساج.")}catch(e){toast("ما قدرتش نصيفط من هنا. طبعي ولا خدي سكرين.")}}
let B=null;
function openBp(id){const r=id?S.bp.find(x=>x.id===id):null,d=new Date();
  const last=S.bp.slice().sort((a,b)=>bpKey(b).localeCompare(bpKey(a)))[0];
  B=r?{...r,sys:String(r.sys),dia:String(r.dia),pulse:r.pulse==null?"":String(r.pulse)}:{id:"b"+Date.now().toString(36),date:todayIso(),time:pad(d.getHours())+":"+pad(d.getMinutes()),sys:String(last?last.sys:120),dia:String(last?last.dia:80),pulse:last&&last.pulse?String(last.pulse):"",note:""};
  B.isNew=!r;B.confirmDel=false;sheet.hidden=false;drawBp();sheet.scrollTop=0}
function bpRead(){for(const k of["date","time","note"]){const el=document.getElementById("bp-"+k);if(el)B[k]=el.value}}
function drawBp(){
  let h='<div class="inner"><div class="toprow"><h1>'+(B.isNew?"قياس جديد":"بدل القياس")+'</h1><button class="iconbtn" data-close="1" aria-label="سد">✕</button></div>';
  h+='<div class="row2"><label class="f">النهار<input class="inp" type="date" id="bp-date" value="'+esc(B.date)+'"></label><label class="f">الساعة<input class="inp" type="time" id="bp-time" value="'+esc(B.time)+'"></label></div>';
  h+='<div class="live" id="bp-live"></div>';
  h+='<div class="wheels">'+[["sys","الانقباضي","SYS · الفوقاني"],["dia","الانبساطي","DIA · التحتاني"],["pulse","النبض","PUL · اختياري"]].map(w=>'<div class="wcol"><b style="color:var(--ink)">'+w[1]+'</b><span>'+w[2]+'</span><div class="wbox">'+wheel(w[0])+'</div></div>').join("")+'</div>';
  h+='<div class="hint" style="text-align:center">حركي العجلة بصبعك ولا ورّكي على الرقم.</div>';
  h+='<div class="nchips">'+BPNOTES.map(n=>'<button type="button" class="'+((B.note||"").includes(n)?"on":"")+'" data-bpnote="'+esc(n)+'">'+esc(n)+'</button>').join("")+'</div>';
  h+='<label class="f">ملاحظة (اختياري)<input class="inp" id="bp-note" value="'+esc(B.note||"")+'" placeholder="ولا كتبي شي حاجة أخرى…"></label>';
  h+='<div id="err" class="alert low" hidden></div><div class="actions"><button class="btn" data-bpsave="1" style="flex:1">سجل</button>'+(B.isNew?'':'<button class="btn danger" data-bpdel="1">'+(B.confirmDel?"متأكدة؟ ورك باش تمسح":"مسح")+'</button>')+'</div></div>';
  sheet.innerHTML=h;
  for(const k of["sys","dia","pulse"])wheelInit(k);bpLive()}
const BPNOTES=["فالصباح","فالليل","قبل الدوا","من بعد الدوا","عيانة","مقلقة","من بعد المشي","صداع"];
const WR={sys:[70,250],dia:[40,150],pulse:[40,180]},WH=40;
function wheel(k){const[a,b]=WR[k];let h='<div class="wheel" id="w-'+k+'" role="listbox" aria-label="'+k+'"><div class="sp"></div>'+(k==="pulse"?'<div class="wi" data-v="">—</div>':'');
  for(let v=a;v<=b;v++)h+='<div class="wi" data-v="'+v+'">'+v+'</div>';return h+'<div class="sp"></div></div>'}
function wheelInit(k){const el=document.getElementById("w-"+k),items=[...el.querySelectorAll(".wi")];
  let i=items.findIndex(x=>x.dataset.v===String(B[k]));if(i<0)i=k==="pulse"?0:items.findIndex(x=>x.dataset.v===(k==="sys"?"120":"80"));
  const mark=j=>{items.forEach((x,n)=>x.classList.toggle("on",n===j));B[k]=items[j].dataset.v;bpLive()};
  el.scrollTop=i*WH;mark(i);let t;
  el.addEventListener("scroll",()=>{const j=Math.max(0,Math.min(items.length-1,Math.round(el.scrollTop/WH)));if(items[j].dataset.v!==B[k]){mark(j);try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}}clearTimeout(t);t=setTimeout(()=>{if(Math.abs(el.scrollTop-j*WH)>1)el.scrollTo({top:j*WH,behavior:"smooth"})},140)},{passive:true});
  el.addEventListener("click",e=>{const it=e.target.closest(".wi");if(!it)return;const j=items.indexOf(it);el.scrollTo({top:j*WH,behavior:"smooth"});mark(j)})}
function bpLive(){const el=document.getElementById("bp-live");if(!el)return;const s=+B.sys,d=+B.dia;
  if(!s||!d){el.innerHTML="";return}const c=bpCat({sys:s,dia:d});
  el.innerHTML='<span class="bpv">'+s+'/'+d+'</span><div style="display:grid;gap:4px;justify-items:start"><span class="cat '+c[0]+'">'+c[1]+'</span>'+(B.pulse?'<small class="hint">💓 '+esc(B.pulse)+'</small>':'')+'</div>'}
function bpStore(){try{localStorage.setItem("dwa.bp",JSON.stringify(S.bp))}catch(e){toast("ما قدرتش نسجل ف هاد التليفون.");return false}return true}
async function bpSave(){bpRead();
  const n=x=>{const v=String(x).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).trim();return /^\d{2,3}$/.test(v)?+v:NaN};
  const sys=n(B.sys),dia=n(B.dia),pulse=String(B.pulse).trim()?n(B.pulse):null;
  if(!B.date||!B.time)return showErr("عمري النهار والساعة.");
  if(Number.isNaN(sys)||Number.isNaN(dia))return showErr("كتبي الرقم الفوقاني والتحتاني (غير أرقام).");
  if(sys<60||sys>260||dia<30||dia>160||(pulse!=null&&(Number.isNaN(pulse)||pulse<30||pulse>220)))return showErr("شي رقم ما معقولش. شوفي الجهاز وعاودي.");
  if(sys<=dia)return showErr("الانقباضي (الفوقاني) خاصو يكون كبر من الانبساطي (التحتاني).");
  const doc={date:B.date,time:B.time,sys,dia,pulse,note:(B.note||"").trim(),ts:Date.now()};
  if(S.db){try{await S.db.doc("bp/"+B.id).set(doc)}catch(err){return showErr("ما تسجلش. عاودي جربي.")}}
  else{const i=S.bp.findIndex(x=>x.id===B.id),r={id:B.id,...doc};if(i<0)S.bp.push(r);else S.bp[i]=r;if(!bpStore())return}
  sheet.hidden=true;const c=bpCat(doc);toast("تسجل ✓ "+sys+"/"+dia+" · "+c[1]);render()}
async function bpDelete(){if(!B.confirmDel){bpRead();B.confirmDel=true;drawBp();return}
  if(S.db){try{await S.db.doc("bp/"+B.id).delete()}catch(err){return showErr("ما تمسحش. عاودي جربي.")}}
  else{S.bp=S.bp.filter(x=>x.id!==B.id);bpStore()}
  sheet.hidden=true;toast("تمسح.");render()}
sheet.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.close){sheet.hidden=true;return}
  if(b.dataset.bpsave){bpSave();return}
  if(b.dataset.bpdel){bpDelete();return}
  if(b.dataset.bpnote!=null){bpRead();const n=b.dataset.bpnote,parts=(B.note||"").split("، ").map(x=>x.trim()).filter(Boolean);const i=parts.indexOf(n);if(i<0)parts.push(n);else parts.splice(i,1);B.note=parts.join("، ");
    b.classList.toggle("on",i<0);const inp=document.getElementById("bp-note");if(inp)inp.value=B.note;return}});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||sheet.contains(b))return;
  if(b.dataset.bpadd){openBp(null);return}
  if(b.dataset.bp){openBp(b.dataset.bp);return}
  if(b.dataset.bprange!=null){S.bpRange=+b.dataset.bprange;try{localStorage.setItem("dwa.bprange",S.bpRange)}catch(err){}render();return}
  if(b.dataset.bprep){S.view="bprep";render();window.scrollTo(0,0);return}
  if(b.dataset.bpback){S.view="bp";render();return}
  if(b.dataset.bpprint){try{window.print()}catch(err){toast("الطبع ما خدامش هنا. خدي سكرين ولا صيفطي.")}return}
  if(b.dataset.bpshare){bpShare();return}
  if(b.dataset.bpcsv){const rows=bpRows();if(!rows.length)return toast("ما كاين والو.");saveFile("daght-ILY-"+todayIso()+".csv",new Blob([bpCsv(rows)],{type:"text/csv"}));return}});
window.addEventListener("storage",e=>{if(e.key==="dwa.bp"){try{S.bp=JSON.parse(e.newValue||"[]")}catch(err){}render()}});
render();
</script>
</body></html>
